spring.application.name=absher-app
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${PORT:8080}
server.forward-headers-strategy=native

management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info

app.security.rate-limit.window=PT5M
app.security.rate-limit.login.max-requests=5
app.security.rate-limit.otp-request.max-requests=3
app.security.rate-limit.otp-verification.max-requests=10
app.security.rate-limit.refresh.max-requests=10

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
