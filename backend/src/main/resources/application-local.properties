spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/chari?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:chari}
spring.datasource.password=${DB_PASSWORD:chari}

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
app.cors.allowed-origin-patterns=http://localhost:*
app.security.lookup-key-base64=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
app.security.encryption-key-base64=ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=

app.jwt.issuer=http://localhost:8080
app.jwt.signing-key-base64=YWJjZGVmMDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
app.jwt.access-token-lifetime=PT15M

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.use-root-path=true

# Opt-in only. Set true for disposable local API data; never enable outside local.
app.demo-data.enabled=false

# Local-only filesystem storage. The application never exposes this directory directly.
app.attachments.local.root=./var/attachments
